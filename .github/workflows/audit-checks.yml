name: Audit branch checks
on:
  push:
    branches: ['audit/**']
  pull_request:
    branches: ['audit/**']
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture
      SUPABASE_SERVICE_ROLE_KEY: fixture
      MUX_TOKEN_ID: fixture
      MUX_TOKEN_SECRET: fixture
      MUX_SIGNING_KEY_ID: fixture
      MUX_SIGNING_PRIVATE_KEY: fixture
      PLAYBACK_HEARTBEATS_ENABLED: 'false'
      MUX_METADATA_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
